<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>{% if form.instance.pk %}Редактировать{% else %}Создать{% endif %} объявление</title>
</head>
<body>
   <h1>{% if form.instance.pk %}Редактировать{% else %}Создать{% endif %} объявление</h1>

   <form method="post">
       {% csrf_token %}
       {{ form.as_p }}
       <button type="submit">Сохранить</button>
       <a href="{% url 'ad_list' %}">Отмена</a>
   </form>

</body>
</html>
